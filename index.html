<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', sans-serif;
    color: #fff;
    background: linear-gradient(180deg, #0D1B3D 0%, #1F3A8A 58%, #2f5fd0 100%);
    height: 100dvh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative; text-align: center;
    padding: clamp(14px, 3vh, 26px) 22px;
  }
  .az-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .42; z-index: 0; }
  .az-blob.b1 { width: 40vh; height: 40vh; top: -12vh; right: -8vh; background: radial-gradient(circle, rgba(124,58,237,.55), transparent 70%); animation: az-float 9s ease-in-out infinite; }
  .az-blob.b2 { width: 34vh; height: 34vh; bottom: -12vh; left: -9vh; background: radial-gradient(circle, rgba(0,194,171,.4), transparent 70%); animation: az-float2 11s ease-in-out infinite; }
  .az-grid { position: absolute; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%); }
  @keyframes az-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-22px) } }
  @keyframes az-float2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(18px) } }
  @keyframes az-rise { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes az-icon-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  .az-wrap { position: relative; z-index: 1; max-width: 660px; width: 100%; animation: az-rise .9s ease both; }

  .az-icon {
    height: clamp(50px, 10.5vh, 100px); aspect-ratio: 130 / 116; margin: 0 auto clamp(12px, 2.2vh, 22px);
    background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMzAgMTE2Ij4KPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CjxwYXRoIGQ9Ik00NCAyMiBMMTYgNTggTDQ0IDk0Ii8+CjxwYXRoIGQ9Ik04NiAyMiBMMTE0IDU4IEw4NiA5NCIvPgo8cGF0aCBkPSJNNjUgNTYgTDY1IDk0Ii8+CjwvZz4KPGNpcmNsZSBjeD0iNjUiIGN5PSIzNCIgcj0iNyIgZmlsbD0iI2ZmZmZmZiIvPgo8L3N2Zz4=") center/contain no-repeat;
    filter: drop-shadow(0 18px 34px rgba(37,99,235,.55)) drop-shadow(0 0 26px rgba(0,194,171,.4));
    animation: az-icon-float 5s ease-in-out infinite;
  }
  .az-brand { font-weight: 800; letter-spacing: 8px; font-size: clamp(20px, min(3.6vh, 6vw), 30px); margin-bottom: 3px; }
  .az-brand-sub { font-weight: 500; font-size: clamp(11px, 1.6vh, 14px); letter-spacing: 4px; color: #9FB2D8; text-transform: uppercase; margin-bottom: clamp(16px, 3.2vh, 32px); }
  h1 { font-size: clamp(26px, min(6.8vh, 11vw), 54px); font-weight: 800; line-height: 1.12; letter-spacing: -1px; margin-bottom: clamp(10px, 1.6vh, 18px); }
  h1 .grad { display: block; font-size: clamp(15px, min(3vh, 5vw), 26px); font-weight: 700; margin-top: clamp(6px, 1.1vh, 11px); background: linear-gradient(90deg, #9AD4FF, #00C2AB); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .az-sub { font-size: clamp(13px, min(1.9vh, 3.4vw), 17px); line-height: 1.7; color: #C3D2EC; margin-bottom: clamp(16px, 3.2vh, 32px); }
  .az-cta { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #0D1B3D; font-weight: 700; font-size: clamp(14px, 1.7vh, 16px); padding: clamp(11px, 1.6vh, 14px) 26px; border-radius: 15px; box-shadow: 0 14px 34px rgba(0,0,0,.28); transition: transform .2s ease; }
  .az-cta:hover { transform: translateY(-2px); }
  .az-foot { margin-top: clamp(20px, 3.8vh, 42px); font-size: clamp(12px, 1.5vh, 14px); color: #B9C6E3; }
