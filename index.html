  html, body { height: 100%; }
  body {
    font-family: 'Manrope', sans-serif;

    display: flex; align-items: center; justify-content: center;

  .az-blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; z-index: 0; }
  .az-blob.b1 { width: 460px; height: 460px; top: -140px; right: -120px; background: radial-gradient(circle, rgba(124,58,237,.6), transparent 70%); animation: az-float 9s ease-in-out infinite; }
  .az-blob.b2 { width: 420px; height: 420px; bottom: -150px; left: -110px; background: radial-gradient(circle, rgba(0,194,171,.5), transparent 70%); animation: az-float2 11s ease-in-out infinite; }
  .az-grid { position: absolute; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%); }
  @keyframes az-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-26px) } }
  @keyframes az-float2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(20px) } }
  @keyframes az-rise { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes az-icon-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  @keyframes az-pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(0,194,171,.55) } 70% { box-shadow: 0 0 0 10px rgba(0,194,171,0) } 100% { box-shadow: 0 0 0 0 rgba(0,194,171,0) } }
  .az-wrap { position: relative; z-index: 1; max-width: 640px; animation: az-rise .9s ease both; }
  .az-icon { width: 130px; height: 116px; margin: 60px auto 26px;
    background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMzAgMTE2Ij4KPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCI+CjxwYXRoIGQ9Ik00NCAyMiBMMTYgNTggTDQ0IDk0Ii8+CjxwYXRoIGQ9Ik04NiAyMiBMMTE0IDU4IEw4NiA5NCIvPgo8cGF0aCBkPSJNNjUgNTYgTDY1IDk0Ii8+CjwvZz4KPGNpcmNsZSBjeD0iNjUiIGN5PSIzNCIgcj0iNyIgZmlsbD0iI2ZmZmZmZiIvPgo8L3N2Zz4=") center/contain no-repeat;
    filter: drop-shadow(0 22px 40px rgba(37,99,235,.6)) drop-shadow(0 0 30px rgba(0,194,171,.45));
    animation: az-icon-float 5s ease-in-out infinite; }
  .az-brand { font-weight: 800; letter-spacing: 8px; font-size: 30px; margin-bottom: 4px; }
  .az-brand-sub { font-weight: 500; font-size: 14px; letter-spacing: 4px; color: #9FB2D8; text-transform: uppercase; margin-bottom: 40px; }
  .az-badge { display: inline-block; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    color: #C6D2EC; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
    padding: 8px 20px; border-radius: 999px; margin-bottom: 24px; }
  .az-badge span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00C2AB; margin-right: 8px; vertical-align: middle; animation: az-pulse-dot 1.8s infinite; }
  h1 { font-size: 60px; font-weight: 800; line-height: 1.15; letter-spacing: -1px; margin-bottom: 20px; }
  h1 .grad { display: block; font-size: 30px; font-weight: 700; margin-top: 12px; background: linear-gradient(90deg, #7CC6FF, #00C2AB); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .az-sub { font-size: 18px; line-height: 1.9; color: #B9C6E3; margin-bottom: 40px; }
  .az-cta { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #0D1B3D; font-weight: 700; font-size: 16px; padding: 15px 30px; border-radius: 16px; box-shadow: 0 14px 34px rgba(0,0,0,.3); transition: transform .2s ease; }
  .az-cta:hover { transform: translateY(-2px); }
  .az-foot { margin-top: 48px; font-size: 14px; color: #8fa2c9; }
