<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style>:root{--az-icon:url("Azka-icon.png")}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أذكى Azka — قريباً</title>
<meta name="description" content="أذكى (Azka) — شريكك التقني للنمو الذكي. موقعنا قيد الإنشاء، ترقّبونا قريباً.">
<link rel="icon" type="image/png" href="Azka-icon.png">
<link rel="apple-touch-icon" href="Azka-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Tajawal', 'Manrope', sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0D1B3D 0%, #1F3A8A 55%, #2563EB 100%);
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    text-align: center;
    padding: 24px;
  }
  /* عناصر زخرفية متحركة في الخلفية */
  .az-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: .5;
    z-index: 0;
  }
  .az-blob.b1 { width: 460px; height: 460px; top: -140px; right: -120px; background: radial-gradient(circle, rgba(124,58,237,.6), transparent 70%); animation: az-float 9s ease-in-out infinite; }
  .az-blob.b2 { width: 420px; height: 420px; bottom: -150px; left: -110px; background: radial-gradient(circle, rgba(0,194,171,.5), transparent 70%); animation: az-float2 11s ease-in-out infinite; }
  .az-grid {
    position: absolute; inset: 0; z-index: 0;
    background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
  }
  @keyframes az-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-26px) } }
  @keyframes az-float2 { 0%,100% { transform: translateY(0) } 50% { transform: translateY(20px) } }
  @keyframes az-rise { from { opacity: 0; transform: translateY(26px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes az-icon-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }

  .az-wrap { position: relative; z-index: 1; max-width: 620px; animation: az-rise .9s ease both; }

  .az-icon {
    width: 118px; height: 128px; margin: 0 auto 30px;
    background: var(--az-icon) center/contain no-repeat;
    filter: drop-shadow(0 22px 40px rgba(37,99,235,.6)) drop-shadow(0 0 30px rgba(0,194,171,.45)) brightness(1.06);
    animation: az-icon-float 5s ease-in-out infinite;
  }
  .az-brand {
    font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: 8px;
    font-size: 30px; margin-bottom: 6px;
  }
  .az-brand-ar { font-weight: 700; font-size: 16px; letter-spacing: 3px; color: #C6D2EC; margin-bottom: 40px; }

  .az-badge {
    display: inline-block; font-size: 14px; font-weight: 600; letter-spacing: 1px;
    color: #C6D2EC; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); padding: 8px 20px; border-radius: 999px; margin-bottom: 24px;
  }
  .az-badge span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00C2AB; margin-left: 8px; vertical-align: middle; box-shadow: 0 0 0 0 rgba(0,194,171,.6); animation: az-pulse-dot 1.8s infinite; }
  @keyframes az-pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(0,194,171,.55) } 70% { box-shadow: 0 0 0 10px rgba(0,194,171,0) } 100% { box-shadow: 0 0 0 0 rgba(0,194,171,0) } }

  h1 { font-size: 58px; font-weight: 800; line-height: 1.25; letter-spacing: -.5px; margin-bottom: 20px; }
  h1 .grad { background: linear-gradient(90deg, #7CC6FF, #00C2AB); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .az-sub { font-size: 19px; line-height: 1.9; color: #B9C6E3; margin-bottom: 40px; }

  .az-cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: #fff; color: #0D1B3D; font-weight: 700; font-size: 16px;
    padding: 15px 30px; border-radius: 16px; box-shadow: 0 14px 34px rgba(0,0,0,.3);
    transition: transform .2s ease;
  }
  .az-cta:hover { transform: translateY(-2px); }

  .az-foot { margin-top: 48px; font-size: 14px; color: #8fa2c9; }

  @media (max-width: 560px) {
    h1 { font-size: 40px; }
    .az-sub { font-size: 17px; }
    .az-icon { width: 96px; height: 104px; }
  }
</style>
</head>
<body>
  <div class="az-blob b1"></div>
  <div class="az-blob b2"></div>
  <div class="az-grid"></div>

  <main class="az-wrap">
    <div class="az-icon" role="img" aria-label="Azka"></div>
    <div class="az-brand">AZKA</div>
    <div class="az-brand-ar">أذكــــــى</div>

    <div class="az-badge"><span></span>الموقع قيد الإنشاء</div>

    <h1>قريباً<br><span class="grad">نُطلق شيئاً ذكياً</span></h1>
    <p class="az-sub">نعمل على بناء تجربة رقمية جديدة تساعد أعمالك على النمو بذكاء.<br>ترقّبونا — سنكون هنا قريباً.</p>

    <a class="az-cta" href="mailto:info@azka.dev">
      تواصل معنا
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"></path><path d="m4 6 8 6 8-6"></path></svg>
    </a>

    <div class="az-foot">© 2026 أذكى AZKA — جميع الحقوق محفوظة.</div>
  </main>
</body>
</html>
